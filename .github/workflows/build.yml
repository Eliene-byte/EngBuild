# Build and release CADKit on GitHub Actions.
#
# One job per platform so a macOS or Linux failure never blocks a Windows
# release. Artifacts are uploaded per-platform and joined in `release`.
#
# Action versions are pinned to the Node 24 majors (checkout v7,
# upload-artifact v7, download-artifact v8, gh-release v3). The v4/v2 majors
# still run, but only because the runner forces them onto a Node 24 runtime it
# no longer supports; bump a major whenever one of these is retired.
#
# Swatinem/rust-cache is left at v2 because that major already targets Node 24.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `never`, not `always`: ANSI colour codes would sit in front of every
  # diagnostic and defeat the file:line parsing that turns them into check
  # annotations.
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- lint/tests
  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux window-system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Format check
        run: cargo fmt --all --check

      # cargo writes diagnostics to stderr in a human format that the GitHub log
      # viewer shows but does not turn into check annotations, so a failure here
      # is invisible from the API. Re-emitting each error line as an `::error::`
      # workflow command makes it a real annotation on the check run.
      - name: Clippy
        run: |
          # The runner invokes this with `bash -e`, so the command must not be
          # allowed to abort the script before the diagnostics are re-emitted.
          status=0
          # -j 2: clippy on wgpu/naga is the peak-memory step in this build, and
          # a cold-cache runner that gets OOM-killed exits 101 with no
          # diagnostic at all. Fewer parallel jobs lowers the peak.
          cargo clippy --workspace --all-targets -j 2 \
            --message-format=short -- -D warnings \
            > clippy.log 2>&1 || status=$?
          cat clippy.log
          if [ "$status" -ne 0 ]; then
            # Re-emit each diagnostic as a workflow command so it becomes a real
            # check annotation; without this a clippy failure is invisible
            # outside the log viewer.
            while IFS= read -r line; do
              file=$(printf '%s' "$line" | cut -d: -f1)
              ln=$(printf '%s' "$line" | cut -d: -f2)
              msg=$(printf '%s' "$line" | cut -d: -f5-)
              echo "::error file=$file,line=$ln,title=clippy::$msg"
            done <<< "$(grep -E '^[^ ]+\.rs:[0-9]+:[0-9]+: error' clippy.log | head -50)"
            # A failure with no parseable diagnostic means cargo itself gave up
            # (bad manifest, unresolvable lockfile). Say so explicitly rather
            # than reporting a bare exit code.
            if ! grep -qE '^[^ ]+\.rs:[0-9]+:[0-9]+: error' clippy.log; then
              echo "::error title=clippy::clippy failed with no Rust diagnostic; cargo itself could not complete."
              # One annotation per log line: a cargo-level failure (manifest,
              # lockfile, rustup component, disk) otherwise shows up here as a
              # bare exit code with nothing to go on.
              # Take the tail: the interesting part is the end. The start is
              # hundreds of "Downloading"/"Checking" lines that tell us nothing.
              # Uploaded logs are only downloadable with a token, so the log has to
              # travel through annotations to be readable at all. Strip the
              # control characters cargo emits so each one is a single line.
              n=0
              while IFS= read -r line && [ "$n" -lt 60 ]; do
                clean=$(printf '%s' "$line" | tr -d '\000-\010\013\014\016-\037')
                echo "::error title=clippy-log::$clean"
                n=$((n + 1))
              done < <(tail -n 60 clippy.log)
            fi
          fi
          exit "$status"

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clippy-log
          path: clippy.log
          if-no-files-found: ignore

      # No GPU in CI, so the headless tests must not need one.
      # Same log-to-annotation treatment as clippy: `cargo test` failures are
      # otherwise just an exit code, because test output goes to stdout and
      # panics are not rustc diagnostics.
      - name: Test
        run: |
          status=0
          cargo test --workspace -j 2 --no-fail-fast > test.log 2>&1 || status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            echo "::error title=test-summary::tests failed; see the failing cases below."
            # The failing test names, then the panic messages, which are indented
            # and carry the actual assertion.
            grep -E '^(test .*(FAILED|panicked)|failures:|error(\[|:))' test.log \
              | head -40 | while IFS= read -r line; do
                echo "::error title=test::$line"
              done
            grep -E '^ +thread .* panicked at |^ +assertion|left:|right:' test.log \
              | head -40 | while IFS= read -r line; do
                echo "::error title=test-panic::$line"
              done
            tail -n 30 test.log | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\000-\010\013\014\016-\037')
              echo "::error title=test-log::$clean"
            done
          fi
          exit "$status"

      - name: Documentation
        run: cargo doc --workspace --no-deps

  # ------------------------------------------------------------------- windows
  windows:
    name: windows x64
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: win-x64

      - name: Build
        run: cargo build --release --locked -p cad

      - name: Test
        run: cargo test --release --locked -p cad -p cad-core -p cad-geom -p cad-doc -p cad-snap -p cad-io -p cad-ui -p cad-app

      - uses: actions/upload-artifact@v7
        with:
          name: cad-windows-x64
          path: target/release/cad.exe
          if-no-files-found: error

  windows-arm:
    name: windows arm64
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: win-arm64

      - name: Cross build
        run: cargo build --release --locked -p cad --target aarch64-pc-windows-msvc

      - uses: actions/upload-artifact@v7
        with:
          name: cad-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/cad.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------- linux
  linux:
    name: linux x64
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            pkg-config

      - name: Build
        run: cargo build --release --locked -p cad

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/cad dist/
          strip dist/cad || true
          tar -czf cadkit-linux-x86_64.tar.gz -C dist cad

      - uses: actions/upload-artifact@v7
        with:
          name: cad-linux-x64
          path: cadkit-linux-x86_64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------- macos
  macos:
    name: macos universal
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Build universal binary
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p cad --target aarch64-apple-darwin
          cargo build --release --locked -p cad --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/cad \
            target/aarch64-apple-darwin/release/cad \
            target/x86_64-apple-darwin/release/cad
          # Ad-hoc signature so the binary runs on Apple Silicon without a
          # developer certificate.
          codesign --force --sign - dist/cad
          tar -czf cadkit-macos-universal.tar.gz -C dist cad

      - uses: actions/upload-artifact@v7
        with:
          name: cad-macos-universal
          path: cadkit-macos-universal.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------------- release
  release:
    name: release
    needs: [windows, windows-arm, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Bundle
        run: |
          mkdir -p release
          cp artifacts/cad-windows-x64/cad.exe            release/cadkit-windows-x64.exe
          cp artifacts/cad-windows-arm64/cad.exe          release/cadkit-windows-arm64.exe
          cp artifacts/cad-linux-x64/cadkit-linux-x86_64.tar.gz    release/
          cp artifacts/cad-macos-universal/cadkit-macos-universal.tar.gz  release/
          ls -la release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          draft: false
