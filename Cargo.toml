[workspace]
resolver = "3"
members = [
    "crates/ai",
    "crates/core",
    "crates/geom",
    "crates/doc",
    "crates/io",
    "crates/snap",
    "crates/gfx",
    "crates/ui",
    "crates/app",
    ".",
]
# `cad` is the binary and owns `src/main.rs`. Its library target is `src/lib.rs`,
# renamed to `cadkit` so the binary can `use cadkit::...`.
default-members = ["."]

[package]
name = "cad"
description = "CADKit: vector 2D drafting and 3D modelling, on wgpu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "cadkit"
path = "src/lib.rs"

[[bin]]
name = "cad"
path = "src/main.rs"

[dependencies]
cad-core = { workspace = true }
cad-geom = { workspace = true }
cad-doc = { workspace = true }
cad-gfx = { workspace = true }
cad-ui = { workspace = true }
cad-app = { workspace = true }
# The status bar shows the live snap modes, so the chrome needs the enum.
cad-snap = { workspace = true }
winit = { workspace = true }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Eliene-byte/EngBuild"
authors = ["CADKit contributors"]

[workspace.dependencies]
cad-core = { path = "crates/core" }
cad-geom = { path = "crates/geom" }
cad-doc = { path = "crates/doc" }
cad-io = { path = "crates/io" }
cad-snap = { path = "crates/snap" }
cad-gfx = { path = "crates/gfx" }
cad-ui = { path = "crates/ui" }
cad-app = { path = "crates/app" }
cad-ai = { path = "crates/ai" }

# `gles` is not optional polish. Without it a machine with no Vulkan driver --
# older Intel iGPU, many VMs, some laptops -- gets no adapter at all and the app
# exits immediately with no window. GL ES via ANGLE/EGL is the fallback tier
# that keeps those machines usable.
wgpu = { version = "30.0", default-features = false, features = [
    "std",
    "wgsl",
    "dx12",
    "metal",
    "vulkan",
    "gles",
] }

# `rwh_06` is mandatory: wgpu 30 implements `SurfaceTarget` for anything that
# provides a raw-window-handle 0.6 pair, and without it `create_surface` has no
# safe entry point. `x11` + `wayland` are the two Linux backends; `wayland-dlopen`
# lets the same binary run on either without linking libwayland at build time.
# `wayland-csd-adwaita` is deliberately left out: it drags in a font stack we
# do not use and would add a build-time system dependency.
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
