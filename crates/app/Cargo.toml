[package]
name = "cad-app"
description = "Maquina de estados, ferramentas interativas e comandos do CAD."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cad-core = { workspace = true }
cad-geom = { workspace = true }
cad-doc = { workspace = true }
cad-snap = { workspace = true }
cad-gfx = { workspace = true }
cad-ui = { workspace = true }
# File I/O lives here rather than in the window crate: opening and saving a
# drawing is a session operation, and the command line has to be able to do it
# without going through the window.
cad-io = { workspace = true }
